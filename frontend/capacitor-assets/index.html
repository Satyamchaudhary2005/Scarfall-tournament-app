<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TournaX</title>
  <script>
    var isOnline = navigator.onLine;
    var REMOTE_URL = 'https://tournax.vercel.app';

    function checkConnectivityAndRedirect() {
      if (navigator.onLine) {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', REMOTE_URL + '/api/health', true);
        xhr.timeout = 5000;
        xhr.onload = function () {
          window.location.replace(REMOTE_URL);
        };
        xhr.onerror = function () {
          showOffline();
        };
        xhr.ontimeout = function () {
          window.location.replace(REMOTE_URL);
        };
        xhr.send();
      } else {
        showOffline();
      }
    }

    function showOffline() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('offline').style.display = 'flex';
    }

    window.addEventListener('online', function () {
      window.location.replace(REMOTE_URL);
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #090909;
      color: rgba(255,255,255,0.9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    #loading {
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,31,31,0.15);
      border-top-color: #ff1f1f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
    }
    #offline { display: none; }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .icon-wrapper {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255,31,31,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      border: 1px solid rgba(255,31,31,0.2);
    }
    .icon-wrapper svg {
      width: 44px;
      height: 44px;
      color: #ff1f1f;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
      padding: 0 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ff1f1f;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 20px rgba(255,31,31,0.15);
    }
    .btn:active { transform: scale(0.97); }
    .footer {
      margin-top: 48px;
      font-size: 13px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body onload="checkConnectivityAndRedirect()">
  <div id="loading">
    <div class="spinner"></div>
    <p>Connecting...</p>
  </div>
  <div id="offline">
    <div class="container">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>No Connection</h1>
      <p>You're offline. Check your internet and try again.</p>
      <button class="btn" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Retry
      </button>
      <div class="footer">TournaX</div>
    </div>
  </div>
</body>
</html>
